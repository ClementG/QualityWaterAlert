services:
  webapp:
    build:
      context: .
      dockerfile: src/QualityWaterAlert.WebApp/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # Required when the app sits behind a NAS reverse proxy (Synology/QNAP/nginx)
      # so that UseHttpsRedirection and generated URLs are correct.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
