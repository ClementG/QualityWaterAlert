name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test — Core
        run: >
          dotnet test tests/QualityWaterAlert.Core.Tests/
          --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=core-results.trx"

      - name: Test — Infrastructure
        run: >
          dotnet test tests/QualityWaterAlert.Infrastructure.Tests/
          --no-build --configuration Release
          --verbosity normal
          --logger "trx;LogFileName=infra-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/*.trx"
          retention-days: 14
